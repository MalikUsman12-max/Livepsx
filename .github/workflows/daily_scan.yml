name: PSX Scan (hourly during market hours)

on:
  schedule:
    # Every hour during PSX trading hours (9:30 AM - 3:30 PM PKT = 04:30-10:30 UTC)
    # Monday-Friday only. Full scan takes up to 40 min, so hourly is the right cadence.
    - cron: '0 4-10 * * 1-5'
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write         # needed so the action can push index.html back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psxdata pandas numpy

      - name: Run the PSX scan
        run: python psx_app.py

      - name: Commit the fresh dashboard back to the repo
        run: |
          git config user.name "PSX Auto-Scan Bot"
          git config user.email "actions@github.com"
          git add psx_dashboard.html index.html
          git diff --quiet --cached || git commit -m "Scan update - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
