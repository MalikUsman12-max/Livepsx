name: PSX Scan (hourly during market hours)

on:
  schedule:
    - cron: '0 4-10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "psxdata>=1.1.1" pandas numpy

      - name: Run the PSX scan
        run: python psx_app.py

      - name: Commit the fresh dashboard back to the repo
        run: |
          git config user.name "PSX Auto-Scan Bot"
          git config user.email "actions@github.com"
          git pull --rebase origin main
          git add psx_dashboard.html index.html prices.json
          git diff --quiet --cached || git commit -m "Scan update - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
